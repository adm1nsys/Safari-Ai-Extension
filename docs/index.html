    <script>
      const REPO = 'https://github.com/adm1nsys/Safari-Ai-Extension';
      const file = (path, label = path) => `<a href="${REPO}/blob/main/${path}" target="_blank" rel="noopener"><code>${label}</code></a>`;
      const dir = (path, label = path) => `<a href="${REPO}/tree/main/${path}" target="_blank" rel="noopener"><code>${label}</code></a>`;
      const STORE = '~/Library/Containers/com.apple.Safari/Data/Library/Safari/MagicExtensions/';
      const DRAFT = '~/Library/Containers/com.apple.Feedback.DraftingExtension/Data/tmp/TemporaryItems/NSIRD_DraftingExtension-macOS_XXXXXX/Drafts/FB/';
      window.PROJECT = {
        repo: 'adm1nsys/Safari-Ai-Extension',
        license: 'MIT',
        langs: ['de', 'en'],
        fallback: [{ label: 'Safari-Ai-Extension (main, zip)', url: `${REPO}/archive/refs/heads/main.zip` }],
        i18n: {
          de: {
            lead: 'Eine Safari-Web-Erweiterung, die Apple Intelligence aus einem Satz erzeugt hat und die danach von Hand weiterentwickelt wurde — und ein Leitfaden für Entwickler: wo Safari 27 solche Erweiterungen ablegt, wie man an den Quelltext samt Prompt kommt und wie man ihn bearbeitet.',
            whereBtn: 'Wo sie liegen',
            download: 'Beispiel herunterladen',
            meta: 'macOS 27 · iOS 27 · iPadOS 27 · geschrieben mit den Entwickler-Betas, geprüft auf macOS 27.2',
            whatTitle: 'Worum es geht',
            whatBody: '<p>Safari 27 kann mit <strong>„Erweiterung beschreiben“</strong> eine komplette Web-Erweiterung aus Text erzeugen: ein Modell auf dem Gerät schreibt <code>manifest.json</code>, <code>content.js</code> und das Popup, Safari installiert sie sofort. Apple zeigt das als „ohne Code, ohne Dateien“ — der Quelltext liegt also nicht dort, wo man ihn sucht.</p><p>Das Beispiel hier ist eine kleine YouTube-Erweiterung: Ländercode neben dem Logo ändern, Logo einfärben, Kopfzeile mit Glas-Effekt, Like/Dislike-Zahlen. Die Funktionen zeigen nur, dass sich so eine echte, nicht triviale Erweiterung bauen und bearbeiten lässt.</p><p><strong>Wer was gemacht hat:</strong> Safari speichert den letzten Prompt im <code>manifest.json</code>; hier ist es noch der erste und einzige: <em>„Make Extension named Better YouTube. Add Menu with title Settings with torn on tumbler“</em>. Daraus hat die KI von Apple eine fast leere Erweiterung gemacht — ein Einstellungsmenü mit einem Ein/Aus-Schalter. Alles für YouTube wurde danach von Hand in den Dateien geschrieben.</p>',
            whereTitle: 'Wo Safari sie speichert',
            whereBody: `<p>Normale Dateisuche findet nichts, und die beiden Datenbanken von Safari führen in die Irre: <code>CloudExtensions.db</code> enthält nur normale Erweiterungen, <code>SandboxExtensions.db</code> nur Dateifreigaben. KI-Erweiterungen liegen in einem eigenen Speicher:</p><pre>${STORE}</pre><p>Jede Erweiterung hat dort einen Ordner mit den bearbeitbaren Dateien und dem ursprünglichen Prompt. Änderungen dort wirken in Safari.</p><p><strong>So wurde der Ordner gefunden:</strong> mit <code>sudo fs_usage -w -f filesys Safari</code> beim Anlegen oder Bearbeiten einer Erweiterung — der Befehl zeigt jede Datei, die Safari anfasst. Verschiebt sich der Pfad in einer späteren Version, findet derselbe Befehl den neuen.</p>`,
            feedbackTitle: 'Quelltext über das Feedback-Formular',
            feedbackBody: `<p>Ohne Terminal: Unter einer erzeugten Erweiterung bietet Safari die Knöpfe <strong>„Sieht gut aus“</strong> und <strong>„Nicht ganz richtig“</strong>. Beim Feedback stellt macOS alle Dateien plus Prompt in einem temporären Entwurfsordner zusammen:</p><pre>${DRAFT}</pre><p>Die Dateien kopieren, bevor das Formular geschlossen wird — der Ordner wird danach geleert. Der Export zeigt die Erweiterung so, wie sie gerade ist — vor oder nach Handänderungen. So entstand ${dir('107777970')}; die Nummer vergibt macOS zufällig.</p>`,
            editTitle: 'Bearbeiten',
            editBody: '<ul><li><strong>Weiter mit dem Assistenten:</strong> „Erweiterung beschreiben“ ändert die bestehende Erweiterung, statt neu anzufangen — gut für grobe Änderungen.</li><li><strong>Dateien direkt bearbeiten:</strong> Es ist eine normale Safari-Web-Erweiterung. Im Ordner unter <code>MagicExtensions/</code> wie jede Web-Erweiterung bearbeiten und in Safari neu laden — gut für genaue Kontrolle.</li></ul><p>Am besten funktioniert: erste Fassung mit KI, dann von Hand verfeinern. So ist dieses Beispiel entstanden.</p>',
            devicesTitle: 'Auf anderen Geräten (Experiment)',
            devicesBody: `<p>Das Format läuft auf macOS, iOS und iPadOS 27. Immer den ganzen Ordner kopieren, nicht die einzelnen Dateien.</p><p><strong>iCloud — bestätigt:</strong> <code>Extensions.db</code> hat eine eigene iCloud-Synchronisation; von Hand bearbeitete Erweiterungen waren innerhalb etwa eines Tages auf dem iPhone.</p><p><strong>Nur hineinlegen — reicht wohl nicht:</strong> In einem Test auf macOS 27.2 blieb die Liste nach dem Löschen von <code>Extensions.db</code> leer, obwohl alle Ordner noch da waren. Eine Erweiterung braucht offenbar ihren Eintrag in der Datenbank. Vorher Safari beenden und sichern; beim Zurückspielen auch <code>-wal</code> und <code>-shm</code> entfernen.</p>`,
            filesTitle: 'Dateien im Repository',
            filesBody: `<ul><li>${dir('BetterYouTube-1E20')} — die bearbeitete, funktionierende Erweiterung (<code>manifest.json</code> mit dem Prompt unter <code>browser_specific_settings.safari.prompt</code>, <code>content.js</code>, Popup).</li><li>${dir('107777970')} — Export eines Feedback-Berichts derselben Erweiterung, mit Prompt.</li><li>${file('Extensions.db')} — die SQLite-Liste aus dem KI-Erweiterungsspeicher, um zu zeigen, wie Safari sie katalogisiert. iCloud-Synchronisationsdaten und Kontofelder sind entfernt.</li></ul>`,
            noteTitle: 'Hinweis',
            noteBody: '<ul><li>Geschrieben mit den Entwickler-Betas von OS 27, geprüft auf macOS 27.2; Apple kann Pfade und Verhalten später ändern.</li><li>Dateien im Safari-Container zu bearbeiten wird von Apple nicht unterstützt — vorher den Ordner sichern.</li><li>Nicht mit Apple oder YouTube verbunden.</li></ul>',
            versionsTitle: 'Versionen',
            title: 'Safari AI Extension — adm1nsys'
          },
          en: {
            lead: 'A Safari Web Extension that Apple Intelligence generated from one sentence and that was then edited by hand — and a guide for developers: where Safari 27 keeps such extensions, how to get the source with its prompt, and how to edit it.',
            whereBtn: 'Where they live',
            download: 'Download the example',
            meta: 'macOS 27 · iOS 27 · iPadOS 27 · written against the developer betas, checked on macOS 27.2',
            whatTitle: 'What this is about',
            whatBody: '<p>Safari 27 can generate a complete Web Extension from text with <strong>“Describe an Extension”</strong>: an on-device model writes <code>manifest.json</code>, <code>content.js</code> and the popup, and Safari installs it right away. Apple presents it as “no code, no files” — so the source is not where you would look for it.</p><p>The example here is a small YouTube extension: change the country code next to the logo, recolour the logo, a glass header, like/dislike numbers. The features are only there to show that a real, non-trivial extension can be built and edited this way.</p><p><strong>Who did what:</strong> Safari keeps the latest prompt in <code>manifest.json</code>; here it is still the first and only one: <em>“Make Extension named Better YouTube. Add Menu with title Settings with torn on tumbler”</em>. From that, Apple’s AI made an almost empty extension — a Settings menu with an on/off switch. Everything for YouTube was written by hand in the files afterwards.</p>',
            whereTitle: 'Where Safari keeps them',
            whereBody: `<p>Ordinary file search finds nothing, and Safari’s two databases are a red herring: <code>CloudExtensions.db</code> holds normal extensions only, <code>SandboxExtensions.db</code> only file grants. AI extensions have a store of their own:</p><pre>${STORE}</pre><p>Each extension has a folder there with the editable files and the original prompt. Changes there take effect in Safari.</p><p><strong>How the folder was found:</strong> with <code>sudo fs_usage -w -f filesys Safari</code> while creating or editing an extension — it prints every file Safari touches. If the path moves in a later version, the same command shows the new one.</p>`,
            feedbackTitle: 'The source via the feedback form',
            feedbackBody: `<p>Without a terminal: under a generated extension Safari offers <strong>“Looks good”</strong> and <strong>“Not quite right”</strong>. For the feedback, macOS gathers all files plus the prompt in a temporary draft folder:</p><pre>${DRAFT}</pre><p>Copy the files before closing the form — the folder is emptied afterwards. The export shows the extension as it is at that moment — before or after hand edits. That is how ${dir('107777970')} was made; macOS picks the number at random.</p>`,
            editTitle: 'Editing',
            editBody: '<ul><li><strong>Keep using the assistant:</strong> “Describe an Extension” changes the existing extension instead of starting over — good for broad changes.</li><li><strong>Edit the files directly:</strong> it is a standard Safari Web Extension. Edit the folder under <code>MagicExtensions/</code> like any web extension and reload in Safari — good for precise control.</li></ul><p>What works best: a first version with AI, then tuning by hand. That is how this example was made.</p>',
            devicesTitle: 'On other devices (experimental)',
            devicesBody: `<p>The format runs on macOS, iOS and iPadOS 27. Always copy the whole folder, not the loose files.</p><p><strong>iCloud — confirmed:</strong> <code>Extensions.db</code> has its own iCloud sync; extensions edited by hand reached the iPhone within about a day.</p><p><strong>Plain drop-in — most likely not enough:</strong> in one test on macOS 27.2 the list stayed empty after <code>Extensions.db</code> was deleted, although every folder was still there. An extension seems to need its row in the database. Quit Safari and back up first; when restoring, also remove <code>-wal</code> and <code>-shm</code>.</p>`,
            filesTitle: 'Files in the repository',
            filesBody: `<ul><li>${dir('BetterYouTube-1E20')} — the edited, working extension (<code>manifest.json</code> with the prompt under <code>browser_specific_settings.safari.prompt</code>, <code>content.js</code>, popup).</li><li>${dir('107777970')} — a feedback report export of the same extension, with its prompt.</li><li>${file('Extensions.db')} — the SQLite list from the AI-extension store, to show how Safari catalogs them. iCloud sync data and account fields are removed.</li></ul>`,
            noteTitle: 'Disclaimer',
            noteBody: '<ul><li>Written against the OS 27 developer betas, checked on macOS 27.2; Apple may change paths and behaviour later.</li><li>Editing files inside Safari’s container is unsupported by Apple — back up the folder first.</li><li>Not affiliated with Apple or YouTube.</li></ul>',
            versionsTitle: 'Versions',
            title: 'Safari AI Extension — adm1nsys'
          }
        }
      };
